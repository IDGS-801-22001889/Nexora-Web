<main class="min-h-screen bg-gray-100 px-4 py-10">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Preguntas Frecuentes</h1>

    @if (cargando()) {
      <p class="text-center text-gray-500">Cargando...</p>
    } @else if (faqs().length === 0) {
      <p class="text-center text-gray-500">Aún no hay preguntas frecuentes.</p>
    } @else {
      <div class="space-y-3">
        @for (faq of faqs(); track faq.idFaq) {
          <div class="bg-white rounded-lg shadow overflow-hidden">
            <button
              (click)="toggle(faq.idFaq)"
              class="w-full text-left px-4 py-3 font-medium text-gray-800 flex justify-between items-center"
            >
              {{ faq.pregunta }}
              <span>{{ abiertoId() === faq.idFaq ? '−' : '+' }}</span>
            </button>
            @if (abiertoId() === faq.idFaq) {
              <p class="px-4 pb-4 text-gray-600">{{ faq.respuesta }}</p>
            }
          </div>
        }
      </div>
    }
  </div>
</main>
