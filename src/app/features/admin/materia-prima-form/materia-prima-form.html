<main class="min-h-screen bg-gray-50 px-6 py-10">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
      {{ esEdicion() ? 'Editar materia prima' : 'Nueva materia prima' }}
    </h1>

    @if (error()) {
      <p class="text-red-600 text-sm mb-4">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input formControlName="nombre" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Unidad de medida</label>
        <input formControlName="unidadMedida" placeholder="pza, kg, ml..." class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Costo unitario inicial</label>
        <input type="number" step="0.01" formControlName="costoUnitario" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084] disabled:bg-gray-100" />
        @if (esEdicion()) {
          <p class="text-xs text-gray-400 mt-1">Solo se actualiza mediante compras registradas.</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock inicial</label>
        <input type="number" step="0.01" formControlName="stock" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084] disabled:bg-gray-100" />
        @if (esEdicion()) {
          <p class="text-xs text-gray-400 mt-1">Solo se actualiza mediante compras registradas.</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full bg-[#2FA084] text-white rounded py-2 font-medium hover:bg-[#1F6F5F] transition disabled:opacity-50"
      >
        {{ cargando() ? 'Guardando...' : (esEdicion() ? 'Guardar cambios' : 'Crear materia prima') }}
      </button>
    </form>
  </div>
</main>
