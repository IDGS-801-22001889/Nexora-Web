<main class="min-h-screen bg-gray-50 px-6 py-10">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Solicita tus accesos</h1>
    <p class="text-gray-500 text-sm mb-6">
      Déjanos tus datos y un administrador de NEXORA se pondrá en contacto contigo para crear tu cuenta.
    </p>

    @if (enviado()) {
      <div class="bg-green-50 border border-green-300 text-green-700 rounded p-4 mb-4">
        ¡Solicitud enviada! Te contactaremos pronto con tus datos de acceso.
      </div>
    } @else {
      @if (error()) {
        <p class="text-red-600 text-sm mb-3">{{ error() }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la empresa</label>
          <input formControlName="nombreEmpresa" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del contacto</label>
          <input formControlName="nombreContacto" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" formControlName="email" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
          <input formControlName="telefono" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mensaje (opcional)</label>
          <textarea formControlName="mensaje" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]"></textarea>
        </div>
        <button type="submit" class="w-full bg-[#2FA084] text-white rounded py-2 font-medium hover:bg-[#1F6F5F] transition">
          Enviar solicitud
        </button>
      </form>
    }
  </div>
</main>
