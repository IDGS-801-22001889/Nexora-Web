<main class="min-h-screen bg-gray-50 px-6 py-10">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
      {{ esEdicion() ? 'Editar proveedor' : 'Nuevo proveedor' }}
    </h1>

    @if (error()) {
      <p class="text-red-600 text-sm mb-4">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Razón social</label>
        <input formControlName="razonSocial" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contacto</label>
        <input formControlName="contacto" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input formControlName="telefono" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo</label>
        <input type="email" formControlName="email" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
        <input formControlName="direccion" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]" />
      </div>

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full bg-[#2FA084] text-white rounded py-2 font-medium hover:bg-[#1F6F5F] transition disabled:opacity-50"
      >
        {{ cargando() ? 'Guardando...' : (esEdicion() ? 'Guardar cambios' : 'Crear proveedor') }}
      </button>
    </form>
  </div>
</main>
