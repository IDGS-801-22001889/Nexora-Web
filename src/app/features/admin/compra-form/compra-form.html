<main class="min-h-screen bg-gray-50 px-6 py-10">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Nueva compra</h1>

    @if (error()) {
      <p class="text-red-600 text-sm mb-4">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor</label>
        <select formControlName="idProveedor" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2FA084]">
          <option value="" disabled>Selecciona un proveedor</option>
          @for (p of proveedores(); track p.idProveedor) {
            <option [value]="p.idProveedor">{{ p.razonSocial }}</option>
          }
        </select>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-medium text-gray-700">Materiales comprados</label>
          <button type="button" (click)="agregarDetalle()" class="text-[#2FA084] text-sm hover:underline">
            + Agregar línea
          </button>
        </div>

        <div formArrayName="detalles" class="space-y-3">
          @for (detalle of detalles.controls; track $index) {
            <div [formGroupName]="$index" class="grid grid-cols-12 gap-2 items-start bg-gray-50 rounded p-3">
              <div class="col-span-5">
                <select formControlName="idMateriaPrima" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm">
                  <option value="" disabled>Materia prima</option>
                  @for (m of materiasPrimas(); track m.idMateriaPrima) {
                    <option [value]="m.idMateriaPrima">{{ m.nombre }} ({{ m.unidadMedida }})</option>
                  }
                </select>
              </div>
              <div class="col-span-3">
                <input type="number" step="0.01" formControlName="cantidad" placeholder="Cantidad" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm" />
              </div>
              <div class="col-span-3">
                <input type="number" step="0.01" formControlName="costoUnitario" placeholder="Costo unit." class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm" />
              </div>
              <div class="col-span-1 flex justify-center pt-1.5">
                <button type="button" (click)="quitarDetalle($index)" class="text-red-500 text-sm">✕</button>
              </div>
            </div>
          }
        </div>
      </div>

      <div class="text-right font-semibold text-[#1F6F5F]">
        Total estimado: ${{ totalEstimado | number:'1.2-2' }}
      </div>

      <button
        type="submit"
        [disabled]="cargando()"
        class="w-full bg-[#2FA084] text-white rounded py-2 font-medium hover:bg-[#1F6F5F] transition disabled:opacity-50"
      >
        {{ cargando() ? 'Guardando...' : 'Registrar compra' }}
      </button>
    </form>
  </div>
</main>
